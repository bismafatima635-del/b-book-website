<form action="https://formsubmit.co/bbook0859@gmail.com" method="POST" class="support-form">

    <input type="hidden" name="_subject" value="New B-Book Support Request">
    <input type="hidden" name="_captcha" value="true">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Your email address" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" placeholder="How can we help you?" required></textarea>

    <button type="submit" class="btn">Send Message</button>

</form>
